<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
  <title id="t">HELLO WORLD - Welcome to my Profile</title>
  <desc id="d">Animated banner for the GitHub profile of Henrique (itsrique), learning Java.</desc>

  <defs>
    <!-- Background: soft blue to soft purple, slowly shifting -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294a">
        <animate attributeName="stop-color" values="#16294a;#1e2f5c;#16294a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2d2559">
        <animate attributeName="stop-color" values="#2d2559;#3a2c6b;#2d2559" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Title: almost white with a faint lilac tint -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset="1" stop-color="#D9CEFF"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <clipPath id="card">
      <rect width="1000" height="240" rx="18"/>
    </clipPath>

    <!-- Reveals the typed line from left to right -->
    <clipPath id="typed">
      <rect x="418" y="176" width="164" height="32">
        <animate attributeName="width" values="0;164;164;0" keyTimes="0;0.35;0.85;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- Soft glows that drift slowly -->
    <g filter="url(#blur)">
      <circle cx="170" cy="70" r="95" fill="#58A6FF" opacity="0.18">
        <animate attributeName="cx" values="170;270;170" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;110;70" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="180" r="105" fill="#A371F7" opacity="0.17">
        <animate attributeName="cx" values="830;740;830" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="180;130;180" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- A few quiet stars -->
    <g fill="#F0F6FC">
      <circle cx="90"  cy="44"  r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="196" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="40"  r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="62"  r="1.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="190" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="6.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="176" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Title and subtitle, fade in once on load -->
    <g>
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="1.4s" begin="0s" fill="freeze"/>
      <text x="500" y="110" text-anchor="middle" fill="url(#title)"
            font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
            font-size="62" font-weight="800" letter-spacing="9">HELLO WORLD</text>
      <text x="500" y="148" text-anchor="middle" fill="#A9C8F5" fill-opacity="0.9"
            font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
            font-size="19" font-weight="400" letter-spacing="2">Welcome to my Profile</text>
    </g>

    <!-- Typed line: > learning Java -->
    <text x="418" y="198" clip-path="url(#typed)" textLength="164" lengthAdjust="spacing"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="18" fill="#C9D1D9"><tspan fill="#A371F7">&gt;</tspan> learning <tspan fill="#58A6FF" font-weight="700">Java</tspan></text>

    <!-- Cursor follows the typing, then blinks -->
    <rect x="418" y="181" width="8" height="20" fill="#58A6FF">
      <animate attributeName="x" values="418;582;582;418" keyTimes="0;0.35;0.85;1" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Thin border -->
  <rect x="0.5" y="0.5" width="999" height="239" rx="18" fill="none" stroke="#58A6FF" stroke-opacity="0.2"/>
</svg>
